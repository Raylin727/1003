<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件記錄與 MTTR 統計</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7385;--line:#e3e6ec;--accent:#2563eb;
 --c1:#2563eb;--c2:#d9362b;--c3:#e08a00;--c4:#1f8a4c;--c5:#8a5cf6}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--text:#e8ebf2;--muted:#98a1b3;--line:#2b323f;--accent:#6b9bff;
 --c1:#6b9bff;--c2:#ff7b72;--c3:#f0b45a;--c4:#5fd08a;--c5:#b69bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .n{font-size:28px;font-weight:700;line-height:1.1}.card .l{color:var(--muted);font-size:13px}
.charts{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:16px}
.panel{margin-bottom:16px}.charts .panel{margin:0}
.panel h2{font-size:14px;margin:0 0 12px}
input,select,button,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.form input,.form select{width:100%}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden}
.col b{font-size:12px;margin-bottom:3px}
.col span{font-size:11px;color:var(--muted);margin-top:4px}
.mttr{font-size:11px;color:var(--muted)}
.hb{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hb .nm{width:64px;font-size:13px}
.hb .tr{flex:1;background:var(--bg);border-radius:4px;height:16px;overflow:hidden}
.hb .tr i{display:block;height:100%}
.hb .v{width:70px;text-align:right;font-size:12px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);padding:2px 8px}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>事件記錄與 MTTR 統計</h1>
  <p class="sub">示範資料 · 記錄斷線與故障事件，自動統計每月事件數、根因分布、平均修復時間（MTTR）</p>

  <div class="cards" id="cards"></div>

  <div class="charts">
    <div class="panel"><h2>近 7 個月事件數（顏色 = 根因）與 MTTR</h2><div class="chart" id="monthChart"></div><div id="legend" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)"></div></div>
    <div class="panel"><h2>各根因平均修復時間</h2><div id="causeChart"></div></div>
  </div>

  <div class="panel">
    <h2>新增事件</h2>
    <form class="form" id="form">
      <label>發生時間<input type="datetime-local" name="start" required></label>
      <label>恢復時間<input type="datetime-local" name="end" required></label>
      <label>根因<select name="cause" id="causeSel"></select></label>
      <label>嚴重度<select name="sev"><option>P1</option><option selected>P2</option><option>P3</option></select></label>
      <label>影響範圍<input name="scope" placeholder="例如 3F 辦公室無網路" required></label>
      <label>處理人員<input name="owner" placeholder="姓名" required></label>
      <label style="justify-content:flex-end"><button class="primary" type="submit">新增事件</button></label>
    </form>
    <div id="formErr" style="color:#d9362b;margin-top:6px"></div>
  </div>

  <div class="tools">
    <select id="fCause"></select>
    <select id="fSev"><option value="">全部嚴重度</option><option>P1</option><option>P2</option><option>P3</option></select>
    <input type="search" id="q" placeholder="搜尋影響範圍、處理人員…" style="flex:1;min-width:180px">
    <button id="resetBtn">還原示範資料</button>
  </div>
  <div class="tw"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty" hidden>沒有符合條件的事件</div></div>
</div>

<script src="ops-db.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAUSES = [['線路','var(--c1)'],['設備','var(--c2)'],['設定','var(--c3)'],['電力','var(--c4)'],['其他','var(--c5)']];
const color = c => (CAUSES.find(x=>x[0]===c)||CAUSES[4])[1];
const pad = n => String(n).padStart(2,'0');
const local = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const now = new Date();

// 示範資料：以固定偽隨機產生過去 6 個月的事件
function demo(){
  let s=7; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const scopes=['3F 辦公室無網路','總機房核心交換器重啟','高雄分公司 WAN 中斷','無線網路間歇斷線','VPN 無法連線','ERP 伺服器網段不通','4F 交換器 PoE 異常','DNS 解析失敗','5F 辦公室網速緩慢','台北分公司專線中斷'];
  const owners=['小陳','小林','阿豪','小美'];
  const causeW=[['線路',.3],['設備',.25],['設定',.25],['電力',.1],['其他',.1]];
  const out=[];
  for(let i=0;i<32;i++){
    const day=Math.floor(rnd()*180)+1;
    const st=new Date(now.getTime()-day*864e5); st.setHours(8+Math.floor(rnd()*11),Math.floor(rnd()*60),0,0);
    let r=rnd(),cause='其他'; for(const [c,w] of causeW){ if(r<w){cause=c;break} r-=w; }
    const base={線路:150,設備:90,設定:45,電力:120,其他:60}[cause];
    const mins=Math.round(base*(0.3+rnd()*1.6));
    const sev = mins>180?'P1':mins>60?'P2':'P3';
    out.push({start:local(st),end:local(new Date(st.getTime()+mins*6e4)),cause,sev,
      scope:scopes[Math.floor(rnd()*scopes.length)],owner:owners[Math.floor(rnd()*owners.length)]});
  }
  return out;
}
let data = demo();
let state={cause:'',sev:'',q:'',sort:'start',dir:-1};
const dur = e => Math.max(0,Math.round((new Date(e.end)-new Date(e.start))/6e4));
const fmtDur = m => m>=60?`${Math.floor(m/60)} 小時 ${m%60} 分`:`${m} 分`;
const avg = a => a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;

function render(){
  // 篩選（卡片與圖表一律以篩選後結果計算）
  const q=state.q.trim().toLowerCase();
  const list=data.filter(e=>(!state.cause||e.cause===state.cause)&&(!state.sev||e.sev===state.sev)&&
    (!q||e.scope.toLowerCase().includes(q)||e.owner.toLowerCase().includes(q)));
  const ds=list.map(dur);
  const since=new Date(now.getTime()-30*864e5);
  const last30=list.filter(e=>new Date(e.start)>=since);
  $('cards').innerHTML=[
    ['事件總數',list.length],['平均修復時間 MTTR',list.length?fmtDur(avg(ds)):'-'],
    ['近 30 天事件',last30.length],['最長修復時間',ds.length?fmtDur(Math.max(...ds)):'-']
  ].map(([l,n])=>`<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  // 每月圖：最近 6 個月，堆疊 = 根因
  const months=[];
  for(let i=6;i>=0;i--) months.push(new Date(now.getFullYear(),now.getMonth()-i,1));
  const mdata=months.map(m=>{
    const es=list.filter(e=>{const d=new Date(e.start);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth()});
    return {label:`${m.getMonth()+1}月`,es,mttr:avg(es.map(dur))};
  });
  const max=Math.max(1,...mdata.map(m=>m.es.length));
  $('monthChart').innerHTML=mdata.map(m=>{
    const segs=CAUSES.map(([c,col])=>{const n=m.es.filter(e=>e.cause===c).length;
      return n?`<div title="${c} ${n}" style="height:${n/max*110}px;background:${col}"></div>`:''}).join('');
    return `<div class="col"><b>${m.es.length||''}</b><div class="stack">${segs}</div><span>${m.label}</span><span class="mttr">${m.es.length?'MTTR '+m.mttr+'分':'-'}</span></div>`;
  }).join('');
  $('legend').innerHTML=CAUSES.map(([c,col])=>`<span><i class="dot" style="background:${col}"></i>${c}</span>`).join('');

  // 根因：事件數 + 平均修復時間
  const cs=CAUSES.map(([c,col])=>{const es=list.filter(e=>e.cause===c);return {c,col,n:es.length,m:avg(es.map(dur))}});
  const cmax=Math.max(1,...cs.map(x=>x.m));
  $('causeChart').innerHTML=cs.map(x=>`<div class="hb"><span class="nm"><i class="dot" style="background:${x.col}"></i>${x.c}</span>
    <div class="tr"><i style="width:${x.m/cmax*100}%;background:${x.col}"></i></div><span class="v">${x.n?x.m+' 分 · '+x.n+'件':'-'}</span></div>`).join('');

  // 表格
  const val={start:e=>e.start,end:e=>e.end,dur:dur,cause:e=>e.cause,sev:e=>e.sev,scope:e=>e.scope,owner:e=>e.owner}[state.sort];
  const rows=list.slice().sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*state.dir});
  const cols=[['start','發生時間'],['end','恢復時間'],['dur','修復時間'],['cause','根因'],['sev','嚴重度'],['scope','影響範圍'],['owner','處理人員']];
  $('head').innerHTML=cols.map(([k,l])=>`<th data-k="${k}">${l}${state.sort===k?(state.dir>0?' ▲':' ▼'):''}</th>`).join('')+'<th></th>';
  $('body').innerHTML=rows.map(e=>`<tr><td>${e.start.replace('T',' ')}</td><td>${e.end.replace('T',' ')}</td><td>${fmtDur(dur(e))}</td>
    <td><i class="dot" style="background:${color(e.cause)}"></i>${e.cause}</td><td>${e.sev}</td><td>${esc(e.scope)}</td><td>${esc(e.owner)}</td>
    <td><button class="x" data-del="${data.indexOf(e)}" title="刪除">✕</button></td></tr>`).join('');
  $('empty').hidden=rows.length>0;
}

$('causeSel').innerHTML=CAUSES.map(([c])=>`<option>${c}</option>`).join('');
$('fCause').innerHTML='<option value="">全部根因</option>'+CAUSES.map(([c])=>`<option>${c}</option>`).join('');
$('fCause').onchange=e=>{state.cause=e.target.value;render()};
$('fSev').onchange=e=>{state.sev=e.target.value;render()};
$('q').oninput=e=>{state.q=e.target.value;render()};
$('head').onclick=e=>{const k=e.target.closest('th')?.dataset.k;if(!k)return;state.dir=state.sort===k?-state.dir:1;state.sort=k;render()};
$('body').onclick=async e=>{
  const d=e.target.dataset.del;if(d===undefined)return;
  const item=data[+d];
  if(OPS.live&&item.pk&&!(await OPS.remove('ops_incidents','id=eq.'+item.pk))) return OPS.fail('刪除失敗');
  data.splice(+d,1);render();
};
$('resetBtn').onclick=async()=>{ await loadData(); render(); };
$('resetBtn').textContent='重新載入資料';
$('form').onsubmit=async e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target));
  if(new Date(f.end)<new Date(f.start)){$('formErr').textContent='恢復時間不能早於發生時間';return}
  $('formErr').textContent='';
  const item={start:f.start,end:f.end,cause:f.cause,sev:f.sev,scope:f.scope.trim(),owner:f.owner.trim()};
  if(OPS.live){
    const row=await OPS.insert('ops_incidents',{started_at:item.start,ended_at:item.end,cause:item.cause,severity:item.sev,scope:item.scope,owner:item.owner});
    if(!row) return OPS.fail('新增失敗');
    item.pk=row.id;
  }
  data.push(item);
  e.target.reset(); render();
};
// 從 Supabase 載入；失敗就沿用內建示範資料
async function loadData(){
  const r=await OPS.select('ops_incidents','order=started_at.desc');
  if(r) data=r.map(x=>({pk:x.id,start:x.started_at.slice(0,16),end:x.ended_at.slice(0,16),cause:x.cause,sev:x.severity,scope:x.scope,owner:x.owner}));
  OPS.mark();
}
// 預設表單時間：一小時前 ~ 現在
const f=$('form'); f.start.value=local(new Date(now.getTime()-36e5)); f.end.value=local(now);
render();
loadData().then(render);
</script>
</body>
</html>
